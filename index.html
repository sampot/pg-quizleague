<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08131f" />
    <meta name="description" content="賽季題庫搶答聯賽：看題搶答、段位 Elo、連擊計分。" />
    <title>搶答聯賽</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambience" aria-hidden="true"><i></i><i></i><i></i></div>
    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow">SEASON · ELO RANKED</p>
          <h1>搶答聯賽</h1>
        </div>
        <button id="sound" class="quiet" type="button" aria-pressed="false">音樂：關</button>
      </header>

      <section id="lobby" class="lobby panel">
        <div class="seal" aria-hidden="true">⚡</div>
        <p>看題搶答、限時作答。十場賽季、六勝晉級，Elo 與段位存於 PG.kv。</p>
        <div class="record">
          <span>最高 Elo</span>
          <strong id="best-rating">1200</strong>
        </div>
        <button id="start" class="primary" type="button">開始賽季</button>
      </section>

      <section id="game" hidden>
        <div class="rank-row">
          <span id="rank-badge" class="rank-badge">黃金</span>
          <div id="hud" class="hud" aria-label="對局狀態"></div>
        </div>

        <section class="stage panel">
          <div class="timer-wrap">
            <div id="timer" class="timer-ring" style="--pct: 100">
              <span id="timer-label">搶答</span>
            </div>
          </div>
          <p id="question-text" class="question-text"></p>
          <div class="progress" aria-hidden="true"><i id="progress"></i></div>
        </section>

        <p id="status" class="message" role="status" aria-live="polite"></p>

        <div id="choices" class="choices" aria-label="選項"></div>

        <button id="buzz" class="buzz-btn" type="button" hidden>搶答！</button>

        <div class="flow-actions">
          <button id="continue" class="primary flow-btn" type="button" hidden>下一題</button>
        </div>

        <section id="end-panel" class="end-panel panel" hidden>
          <h2 id="end-title">賽季結束</h2>
          <div id="end-body"></div>
          <button id="restart" class="primary" type="button">再戰新賽季</button>
        </section>
      </section>

      <footer>
        <button id="help" class="text-button" type="button">玩法</button>
        <a href="./ATTRIBUTION.md">素材署名</a>
      </footer>
    </main>

    <p id="toast" class="toast" role="status" hidden></p>

    <section id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-card">
        <p class="eyebrow">QUIZ LEAGUE</p>
        <h2 id="sheet-title">玩法</h2>
        <div id="sheet-body"></div>
        <button id="sheet-close" class="primary" type="button">知道了</button>
      </div>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
